name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch the Electron binary into the cache
        run: node node_modules/electron/install.js

      - uses: nrwl/nx-set-shas@v4

      - name: Governance checks
        run: bash .claude/hooks/governance.sh

      - name: Exact dependency pins (SEC-5)
        run: node tools/scripts/check-exact-pins.mjs

      - name: Format
        run: pnpm exec prettier --check .

      - name: Lint, typecheck, test, build (affected)
        run: pnpm nx affected -t lint typecheck test build

      - name: Custom ESLint rules and commitlint plugin tests
        run: pnpm nx run-many -p eslint-rules commitlint-plugin -t test

      - name: Dictionary parity negative fixtures must fail typecheck (I18N-1)
        run: pnpm nx run shared-i18n:typecheck-negative

      - name: Commit grammar rejects a malformed message (PROC-2)
        run: |
          if echo "bad message" | pnpm exec commitlint --config commitlint.config.mjs; then
            echo "commitlint accepted a malformed message" >&2
            exit 1
          fi

      - name: Install Electron system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Electron e2e smoke with axe (TEST-1, NG-12, SEC-2)
        run: xvfb-run -a pnpm nx e2e renderer-e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output
          path: dist/.playwright
          retention-days: 7

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Mutation gate on contracts and main (TEST-3, break 80)
        run: pnpm nx run-many -t mutation -p contracts main

      - name: Mutation gate on renderer data-access (TEST-3, break 70)
        run: pnpm nx run-many -t mutation --projects 'renderer-*'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: reports/mutation
          retention-days: 7
