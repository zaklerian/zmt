name: CI

on:
  push:
    branches:
      - 'dev/**'
      - 'hotfix/**'
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same PR when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      actions: read          # nx-set-shas needs this
      pull-requests: read    # PR context for affected base SHA on PR runs
    steps:
      - uses: actions/checkout@v4
        with:
          # Nx affected needs git history to diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint typecheck test build --parallel=3
