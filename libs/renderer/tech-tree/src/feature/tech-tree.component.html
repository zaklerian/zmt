<h2 class="title">{{ messages().techTree.title }}</h2>
<div class="chrome">
  <zmt-canvas-toolbar
    [categories]="tree.categories()"
    [search]="tree.search()"
    [selectedCategories]="tree.selectedCategories()"
    (searchChange)="tree.setSearch($event)"
    (selectedCategoriesChange)="tree.setSelectedCategories($event)"
  />
  <mat-slide-toggle
    class="dependencies"
    [checked]="tree.showDependencies()"
    (change)="tree.setShowDependencies($event.checked)"
  >
    {{ messages().techTree.dependenciesToggle }}
  </mat-slide-toggle>
</div>
<zmt-canvas-actions
  [addStatus]="form.status()"
  [busy]="form.busy() || delete.deleting()"
  [deleteStatus]="delete.status()"
  [editStatus]="form.status()"
  [technologyId]="tree.selectedId()"
  (add)="onAddChild()"
  (deleteTechnology)="onDelete()"
  (edit)="onEdit()"
/>
@if (message(); as text) {
  <p class="message">{{ text }}</p>
} @else {
  <zmt-tech-tree-canvas
    [edges]="tree.visibleEdges()"
    [nodes]="tree.nodeViews()"
    (nodeContextMenu)="openNodeMenu($event)"
    (openNode)="form.openEdit($event)"
    (paneContextMenu)="openPaneMenu($event)"
    (selectNode)="tree.select($event)"
  />
}
@if (menu(); as target) {
  <zmt-canvas-context-menu
    [anchor]="target.anchor"
    [technologyId]="target.technologyId"
    (addChild)="form.openAddChild($event); closeMenu()"
    (addFree)="form.openAddFree(target.position); closeMenu()"
    (deleteTechnology)="delete.open($event); closeMenu()"
    (dismiss)="closeMenu()"
    (edit)="form.openEdit($event); closeMenu()"
  />
}
@if (delete.isConfirming() && delete.plan() && delete.token(); as token) {
  @if (delete.plan(); as plan) {
    <zmt-technology-delete-dialog
      [busy]="delete.deleting()"
      [hasTree]="delete.hasTree()"
      [plan]="plan"
      [token]="token"
      (confirmDelete)="delete.commit($event)"
      (dismiss)="delete.cancel()"
    />
  }
}
