<header>
  <zmt-app-toolbar
    [expanded]="expanded()"
    [locale]="locale()"
    [locales]="locales"
    [messages]="messages()"
    (localeChange)="i18n.setLocale($event)"
    (openFolder)="workspace.openFolder()"
    (openSettings)="openSettings()"
    (toggleNavigation)="toggleNavigation()"
  />
</header>
<mat-sidenav-container class="container" autosize>
  <mat-sidenav
    id="zmt-navigation"
    class="rail"
    mode="side"
    opened
    disableClose
    [class.expanded]="expanded()"
  >
    <zmt-nav-rail [entries]="entries" [expanded]="expanded()" [messages]="messages()" />
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
<zmt-app-footer [messages]="messages()" [version]="version" />
